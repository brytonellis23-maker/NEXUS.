<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXUS CAM Mobile</title><link rel="stylesheet" href="style.css"></head><body><header><b>NEXUS CAM</b><span>MOBILE CONTROL</span></header><div class="mobile"><div class="phoneVideo"><img src="/camera.mjpeg"><div class="ret"></div></div><button class="listen" onclick="voice()">🎙 TALK TO NEXUS</button><div id="heard">Say “Nexus, lock onto the red cup.”</div><div class="pad"><button onclick="cmd('up')">▲</button><p><button onclick="cmd('left')">◀</button><button onclick="cmd('stop')">STOP</button><button onclick="cmd('right')">▶</button></p><button onclick="cmd('down')">▼</button></div><button class="estop" onclick="cmd('estop')">EMERGENCY STOP</button><p id="msg">Ready.</p></div><script>
async function cmd(c){await fetch("/api/command",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({command:c})});}
function speak(t){document.getElementById("msg").textContent=t;speechSynthesis?.speak(new SpeechSynthesisUtterance(t))}
function voice(){let S=SpeechRecognition||webkitSpeechRecognition;if(!S){speak("Voice recognition is not supported.");return}let r=new S();r.onresult=e=>{let s=e.results[0][0].transcript.toLowerCase();document.getElementById("heard").textContent=s;if(s.includes("stop")){cmd("estop");speak("Emergency stop.")}else if(s.includes("left"))cmd("left");else if(s.includes("right"))cmd("right");else if(s.includes("up"))cmd("up");else if(s.includes("down"))cmd("down");else if(s.includes("unlock")){cmd("stop");speak("Unlocked.")}else if(s.includes("lock")||s.includes("find"))speak("Use the PC NEXUS screen for AI object locking.")};r.start()}
</script></body></html>
